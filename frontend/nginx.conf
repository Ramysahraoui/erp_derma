server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 16m;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Entetes de securite (deploiement en reseau local)
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "same-origin" always;

  # Resolution DNS interne de Docker : le serveur web demarre meme si l'API
  # n'est pas encore prete et suit ses changements d'adresse (redemarrage,
  # mise a jour), au lieu de refuser de demarrer.
  resolver 127.0.0.11 ipv6=off valid=10s;

  # API metier et pieces jointes (certificats d'analyse)
  location /api/ {
    set $amont http://api:3000;
    proxy_pass $amont;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;   # generation des documents PDF
  }

  location /fichiers/ {
    set $amont_fichiers http://api:3000;
    proxy_pass $amont_fichiers;
    proxy_set_header Host $host;
  }

  # Ressources versionnees par le build
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Application monopage : toute route inconnue rend index.html
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }

  # Page lisible si l'API est momentanement indisponible
  error_page 502 503 504 /indisponible.html;
  location = /indisponible.html {
    internal;
    default_type text/html;
    return 503 '<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Service indisponible</title><style>body{font-family:system-ui,sans-serif;display:grid;place-items:center;height:100vh;margin:0;background:#f1f5f9;color:#0f172a}div{text-align:center;max-width:32rem;padding:2rem}h1{color:#0f766e}</style></head><body><div><h1>Service momentanement indisponible</h1><p>Le serveur applicatif redemarre. Reessayez dans quelques instants.</p><p style="color:#64748b;font-size:.9rem">Si le probleme persiste, contacter l administrateur : <code>docker compose ps</code></p></div></body></html>';
  }
}
